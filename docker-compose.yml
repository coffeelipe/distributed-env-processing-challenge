services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distributed_processing}
      POSTGRES_USER: ${POSTGRES_USER:-distributed_processing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distributed_processing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - distributed_processing

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distributed_processing}
      KC_DB_USERNAME: ${POSTGRES_USER:-distributed_processing}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-distributed_processing}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - distributed_processing

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-sa-east-1}
      WAGER_TRANSACTIONS_QUEUE: ${WAGER_TRANSACTIONS_QUEUE:-wager-transactions.fifo}
      WAGER_TRANSACTIONS_DLQ: ${WAGER_TRANSACTIONS_DLQ:-wager-transactions-dlq.fifo}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - distributed_processing

volumes:
  postgres_data:
  localstack_data:

networks:
  distributed_processing: